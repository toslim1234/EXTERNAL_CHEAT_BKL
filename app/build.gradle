apply plugin: 'com.android.application'

android {
    compileSdkVersion 34

    namespace 'com.microsoft.xboxone.smartglass'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.microsoft.xboxone.smartglass"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true // AIDE might ignore this, but keep it for Gradle compatibility
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    /*buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }*/



    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    ndkVersion '24.0.8215888' // Ajuste conforme necessário

    // Root helpers are built as ELF executables by ndk-build (extensionless
    // output) and staged into this directory with .so names below, because
    // Android only extracts lib/<abi>/*.so entries from an APK.
    sourceSets {
        main {
            jniLibs.srcDir file("$buildDir/generated/jniLibs")
        }
    }
}

// ndk-build refuses a file extension on LOCAL_MODULE_FILENAME for
// BUILD_EXECUTABLE, but the app extracts libbklkilld.so / libbkliject.so from
// the APK. Copy the linked binaries into jniLibs under those names so AGP
// packages and installs them normally.
tasks.register('stageRootExecutables') {
    description = 'Stage root executables into jniLibs with .so names'
    dependsOn 'externalNativeBuildDebug'
    doLast {
        def outDir = file("$buildDir/generated/jniLibs/arm64-v8a")
        outDir.mkdirs()
        ['Debug', 'Release'].each { cfg ->
            def root = file("$buildDir/intermediates/cxx/$cfg")
            if (!root.exists()) return
            fileTree(root).matching {
                include '**/lib/arm64-v8a/libbklkilld'
                include '**/lib/arm64-v8a/libbkliject'
            }.each { binary ->
                copy {
                    from binary
                    into outDir
                    rename { binary.name + '.so' }
                }
            }
        }
        if (!file("$outDir/libbklkilld.so").exists()) {
            throw new GradleException('bklkilld executable was not staged; check ndk-build output')
        }
    }
}

tasks.matching {
    it.name in ['mergeDebugJniLibFolders', 'mergeReleaseJniLibFolders',
                'packageDebug', 'packageRelease']
}.configureEach {
    dependsOn 'stageRootExecutables'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    def libsuVersion = '3.1.2'
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    implementation "com.github.topjohnwu.libsu:service:${libsuVersion}"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
}
